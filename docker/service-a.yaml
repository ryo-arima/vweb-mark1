services:
  service-a-front:
    image: vweb/service-a-front:dev
    build:
      context: ./service-a/front
    expose:
      - "80"
    networks:
      - vweb-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  service-a-back:
    image: vweb/service-a-back:dev
    build:
      context: ./service-a/back
    environment:
      APP_ENV: ${APP_ENV:-development}
      SERVICE_NAME: service-a
      PORT: "8000"
      DATABASE_URL: postgres://service_a:${VWEB_SERVICE_DB_PASSWORD:?VWEB_SERVICE_DB_PASSWORD is required}@postgres:5432/vweb
      KEYCLOAK_API_URL: https://keycloak:8443
      KEYCLOAK_REALM: vweb
      KEYCLOAK_API_CLIENT_ID: service-a-api
      KEYCLOAK_API_CLIENT_SECRET: ${KEYCLOAK_SERVICE_A_CLIENT_SECRET:?KEYCLOAK_SERVICE_A_CLIENT_SECRET is required}
      KEYCLOAK_CA_CERT: /pki/ca/root_ca.crt
      KEYCLOAK_CLIENT_CERT: /pki/service-a/client.crt
      KEYCLOAK_CLIENT_KEY: /pki/service-a/client.key
    volumes:
      - ./private/pki:/pki:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - vweb-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8000/readyz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
