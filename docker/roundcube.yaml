services:
  roundcube:
    image: roundcube/roundcubemail:latest
    ports:
      - "127.0.0.1:3005:80"
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: mailserver
      ROUNDCUBEMAIL_DEFAULT_PORT: "143"
      ROUNDCUBEMAIL_SMTP_SERVER: mailserver
      ROUNDCUBEMAIL_SMTP_PORT: "587"
      ROUNDCUBEMAIL_SMTP_USER: "%u"
      ROUNDCUBEMAIL_SMTP_PASS: "%p"
      ROUNDCUBEMAIL_SMTP_AUTH_TYPE: LOGIN
      ROUNDCUBEMAIL_USERNAME_DOMAIN: vweb.local
      ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: 10M
      ROUNDCUBEMAIL_DB_TYPE: pgsql
      ROUNDCUBEMAIL_DB_HOST: postgres
      ROUNDCUBEMAIL_DB_PORT: "5432"
      ROUNDCUBEMAIL_DB_USER: roundcube
      ROUNDCUBEMAIL_DB_PASSWORD: ${VWEB_ROUNDCUBE_DB_PASSWORD:?VWEB_ROUNDCUBE_DB_PASSWORD is required}
      ROUNDCUBEMAIL_DB_NAME: roundcube
    depends_on:
      dns:
        condition: service_started
      mailserver:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$c=@fsockopen(\"127.0.0.1\",80); exit($$c?0:1);'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      vweb-mail-network:
        ipv4_address: 172.31.0.11
    dns:
      - 172.31.0.53
    restart: unless-stopped

networks:
  vweb-mail-network:
    name: vweb-mail-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24
          gateway: 172.31.0.1
