worker_processes auto;

env KEYCLOAK_BFF_CLIENT_SECRET;
env SESSION_ENCRYPTION_KEY;
env VWEB_BFF_DB_PASSWORD;
env VWEB_PUBLIC_URL;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type application/octet-stream;
    sendfile      on;
    server_tokens off;
    resolver 127.0.0.11 ipv6=off valid=1s;

    lua_package_path "/usr/local/openresty/site/lualib/?.lua;/usr/local/openresty/site/lualib/?/init.lua;/etc/openresty/?.lua;;";
    lua_package_cpath "/usr/local/openresty/site/lualib/?.so;;";
    lua_ssl_trusted_certificate /etc/pki/ca/root_ca.crt;
    lua_ssl_verify_depth 2;
    lua_shared_dict discovery 1m;
    lua_shared_dict jwks 1m;
    lua_shared_dict vweb_oidc 1m;

    init_by_lua_block {
        require("vweb_oidc").init()
    }

    log_format vweb '$remote_addr [$time_iso8601] "$request" $status $body_bytes_sent';
    access_log /dev/stdout vweb;
    error_log /dev/stderr warn;

    server {
        listen 80;
        server_name vweb.local _;

        location = /healthz {
            allow 127.0.0.1;
            deny all;
            default_type application/json;
            return 200 '{"status":"ok","component":"openresty"}';
        }

        location / {
            return 301 https://vweb.local$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name vweb.local;
        resolver 127.0.0.11 ipv6=off valid=1s;

        ssl_certificate /etc/pki/openresty/openresty.crt;
        ssl_certificate_key /etc/pki/openresty/openresty.key;
        ssl_client_certificate /etc/pki/ca/root_ca.crt;
        ssl_verify_client optional;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # These variables are written only after the OIDC session is validated.
        set $bff_user_sub "";
        set $bff_user_email "";
        set $bff_user_roles "";
        set $bff_user_groups "";
        # Resolve Compose service names for every request so recreated containers do not leave stale upstream IPs.
        set $service_a_front_host service-a-front;
        set $service_b_front_host service-b-front;
        set $service_a_back_host service-a-back;
        set $service_b_back_host service-b-back;
        set $keycloak_host keycloak;

        location = /healthz {
            if ($ssl_client_verify != SUCCESS) { return 495; }
            default_type application/json;
            return 200 '{"status":"ok","component":"openresty"}';
        }

        location = /service-a {
            if ($ssl_client_verify != SUCCESS) { return 495; }
            return 301 /service-a/;
        }

        location = /service-b {
            if ($ssl_client_verify != SUCCESS) { return 495; }
            return 301 /service-b/;
        }

        location /service-a/ {
            if ($ssl_client_verify != SUCCESS) { return 495; }
            access_by_lua_block {
                require("vweb_oidc").authenticate("redirect")
            }
            rewrite ^/service-a/?(.*)$ /$1 break;
            proxy_pass http://$service_a_front_host:80;
            proxy_set_header Host service-a-front;
            proxy_set_header Forwarded "";
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host service-a-front;
            proxy_set_header X-Forwarded-Port 80;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Prefix /service-a;
            proxy_set_header X-User-Sub "";
            proxy_set_header X-User-Email "";
            proxy_set_header X-User-Roles "";
            proxy_set_header X-User-Groups "";
            proxy_set_header X-Client-Cert-Serial "";
        }

        location /service-b/ {
            if ($ssl_client_verify != SUCCESS) { return 495; }
            access_by_lua_block {
                require("vweb_oidc").authenticate("redirect")
            }
            rewrite ^/service-b/?(.*)$ /$1 break;
            proxy_pass http://$service_b_front_host:80;
            proxy_set_header Host service-b-front;
            proxy_set_header Forwarded "";
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host service-b-front;
            proxy_set_header X-Forwarded-Port 80;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Prefix /service-b;
            proxy_set_header X-User-Sub "";
            proxy_set_header X-User-Email "";
            proxy_set_header X-User-Roles "";
            proxy_set_header X-User-Groups "";
            proxy_set_header X-Client-Cert-Serial "";
        }

        location ~ ^/auth/realms/master(?:/|$) {
            if ($ssl_client_verify != SUCCESS) { return 495; }
            return 404;
        }

        location = /auth/login {
            if ($ssl_client_verify != SUCCESS) { return 495; }
            access_by_lua_block {
                require("vweb_oidc").authenticate("redirect", "/")
            }
            content_by_lua_block {
                ngx.exit(204)
            }
        }

        location = /auth/callback {
            if ($ssl_client_verify != SUCCESS) { return 495; }
            access_by_lua_block {
                require("vweb_oidc").authenticate("redirect")
            }
            content_by_lua_block {
                ngx.exit(204)
            }
        }

        location = /auth/session {
            if ($ssl_client_verify != SUCCESS) { return 495; }
            default_type application/json;
            content_by_lua_block {
                require("vweb_oidc").session_info()
            }
        }

        location = /auth/logout {
            if ($ssl_client_verify != SUCCESS) { return 495; }
            content_by_lua_block {
                require("vweb_oidc").logout()
            }
        }

        location /auth/ {
            if ($ssl_client_verify != SUCCESS) { return 495; }
            rewrite ^/auth/?(.*)$ /$1 break;
            proxy_pass https://$keycloak_host:8443;
            proxy_ssl_server_name on;
            proxy_ssl_name keycloak;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_trusted_certificate /etc/pki/ca/root_ca.crt;
            proxy_ssl_certificate /etc/pki/openresty/client.crt;
            proxy_ssl_certificate_key /etc/pki/openresty/client.key;
            proxy_set_header Host keycloak;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-Prefix /auth;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-User-Sub "";
            proxy_set_header X-User-Email "";
            proxy_set_header X-User-Roles "";
            proxy_set_header X-User-Groups "";
            proxy_set_header X-Client-Cert-Serial "";
        }

        location /api/service-a/ {
            if ($ssl_client_verify != SUCCESS) { return 495; }
            access_by_lua_block {
                require("vweb_oidc").authenticate("deny")
            }
            rewrite ^/api/service-a/?(.*)$ /$1 break;
            proxy_pass http://$service_a_back_host:8000;
            proxy_set_header Host service-a-back;
            proxy_set_header Forwarded "";
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host service-a-back;
            proxy_set_header X-Forwarded-Port 8000;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Prefix /api/service-a;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-User-Sub $bff_user_sub;
            proxy_set_header X-User-Email $bff_user_email;
            proxy_set_header X-User-Roles $bff_user_roles;
            proxy_set_header X-User-Groups $bff_user_groups;
            proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        }

        location /api/service-b/ {
            if ($ssl_client_verify != SUCCESS) { return 495; }
            access_by_lua_block {
                require("vweb_oidc").authenticate("deny")
            }
            rewrite ^/api/service-b/?(.*)$ /$1 break;
            proxy_pass http://$service_b_back_host:8000;
            proxy_set_header Host service-b-back;
            proxy_set_header Forwarded "";
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host service-b-back;
            proxy_set_header X-Forwarded-Port 8000;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Prefix /api/service-b;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-User-Sub $bff_user_sub;
            proxy_set_header X-User-Email $bff_user_email;
            proxy_set_header X-User-Roles $bff_user_roles;
            proxy_set_header X-User-Groups $bff_user_groups;
            proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        }

        location = / {
            if ($ssl_client_verify != SUCCESS) { return 495; }
            access_by_lua_block {
                require("vweb_oidc").authenticate("redirect", "/service-a/")
            }
            content_by_lua_block {
                return ngx.redirect("/service-a/")
            }
        }

        location / {
            if ($ssl_client_verify != SUCCESS) { return 495; }
            access_by_lua_block {
                require("vweb_oidc").authenticate("redirect")
            }
            default_type application/json;
            content_by_lua_block {
                ngx.status = 404
                ngx.say('{"error":"not found"}')
                ngx.exit(404)
            }
        }
    }
}
